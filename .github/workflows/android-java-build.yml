name: Android Java build

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/java-android-foundation]

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Assemble debug APK
        run: bash gradlew --no-daemon :app:assembleDebug
